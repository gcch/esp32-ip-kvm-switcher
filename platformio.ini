[platformio]
default_envs = seeed_xiao_esp32c6
src_dir = esp32-ip-kvm-switcher
data_dir = esp32-ip-kvm-switcher/data

[env:seeed_xiao_esp32c6]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/build_number.py, post:scripts/platformio_set_mklittlefs.py
upload_speed = 460800
monitor_speed = 115200

platform_packages =
  platformio/tool-mklittlefs@1.203.210628

lib_deps =
  bblanchon/ArduinoJson@^7.4.3
